name: Market renderer isolation
on:
  pull_request:
permissions:
  contents: read
jobs:
  isolate:
    if: github.event.pull_request.draft && startsWith(github.head_ref, 'art/closing-time-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.6.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned software renderer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot-market.zip
          unzip -q /tmp/godot-market.zip -d /tmp/godot-market
          sudo install "/tmp/godot-market/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Capture identical Market angles with isolated costs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/market-isolation
          export XDG_DATA_HOME="$RUNNER_TEMP/market-data" XDG_CONFIG_HOME="$RUNNER_TEMP/market-config" XDG_CACHE_HOME="$RUNNER_TEMP/market-cache"
          godot --headless --audio-driver Dummy --path . --editor --import --quit > build/market-isolation/import.log 2>&1
          CLOSING_MARKET_DIAGNOSTIC_DIR="$PWD/build/market-isolation" LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 \
            timeout --signal=TERM 360 xvfb-run -a -s '-screen 0 1440x900x24' godot --display-driver x11 \
              --audio-driver Dummy --path . --resolution 1280x800 --script tools/opening/profile_market_isolation.gd \
              2>&1 | tee build/market-isolation/market-render.log
      - name: Compare live versus paused on the exact capture clock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/market-isolation/fixed
          export XDG_DATA_HOME="$RUNNER_TEMP/fixed-data" XDG_CONFIG_HOME="$RUNNER_TEMP/fixed-config" XDG_CACHE_HOME="$RUNNER_TEMP/fixed-cache"
          export CLOSING_MARKET_DIAGNOSTIC_DIR="$PWD/build/market-isolation/fixed" CLOSING_MARKET_PAIR_ONLY=1
          LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 timeout --signal=TERM 170 xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' godot --display-driver x11 --fixed-fps 60 --audio-driver Dummy --path . --resolution 1280x800 --script tools/opening/profile_market_isolation.gd 2>&1 | tee build/market-isolation/fixed/market-render.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: closing-time-market-isolation
          path: build/market-isolation/
          if-no-files-found: warn

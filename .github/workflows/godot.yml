name: Godot validation
on:
  pull_request:
  push:
    branches: [ui-pass]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned engine and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$target"
          cp -a /tmp/godot-templates/templates/. "$target/"
          godot --version
      - name: Install validation dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Existing engine checks
        run: bash scripts/validate_project.sh
      - name: Check original geometry and rigs
        run: |
          godot --headless --path . --script tests/original_props_tests.gd
          godot --headless --path . --script tests/original_characters_tests.gd
      - name: Validate art reference assets
        run: godot --headless --path . --script tests/art_reference_tests.gd -- --art-reference
      - name: Export browser package
        run: bash scripts/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: closing-time-web
          path: build/closing-time-web.zip
          if-no-files-found: error
      - name: Render reference scene captures
        run: |
          sudo apt-get install -y xvfb mesa-utils
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a godot --path . --resolution 960x540 -- --capture-reference --art-reference
          test -s local/screenshots/ref_4_exterior_wide.png
          test -s local/screenshots/ref_7_register.png
          test -s local/screenshots/ref_8_office_pc.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-reference-renders
          path: local/screenshots/ref_*.png
          if-no-files-found: ignore
      - name: Print failed validation logs
        if: failure()
        run: |
          for f in local/validation-*.log; do echo "=== $f ==="; tail -n 80 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: local/validation-*.log
          if-no-files-found: ignore

name: Godot validation
on:
  pull_request:
  push:
    branches: [ui-pass]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned engine and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$target"
          cp -a /tmp/godot-templates/templates/. "$target/"
          godot --version
      - name: Install validation dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Existing engine checks
        run: bash scripts/validate_project.sh
      - name: Check original geometry and rigs
        run: |
          godot --headless --path . --script tests/original_props_tests.gd
          godot --headless --path . --script tests/original_characters_tests.gd
          godot --headless --audio-driver Dummy --path . --script tests/cooler_aisle_tests.gd
          godot --headless --audio-driver Dummy --path . --script tests/opening_art_tests.gd
          godot --headless --audio-driver Dummy --path . --script tests/scene_reload_tests.gd
      - name: Export browser package
        run: bash scripts/build_web.sh
      - name: Audit packaged resource contents
        run: bash scripts/audit_web_pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: closing-time-web
          path: build/closing-time-web.zip
          if-no-files-found: error
      - name: Build Linux playtest
        if: github.event.pull_request.draft
        shell: bash
        run: |
          mkdir -p build/linux
          godot --headless --audio-driver Dummy --path . --export-release Linux build/linux/ClosingTime.x86_64
          zip -q -j build/closing-time-linux-x64.zip build/linux/ClosingTime.x86_64
      - uses: actions/upload-artifact@v4
        if: github.event.pull_request.draft
        with:
          name: closing-time-linux-x64
          path: build/closing-time-linux-x64.zip
          if-no-files-found: error
      - name: Capture and profile actual opening frames
        if: github.event.pull_request.draft
        shell: bash
        run: |
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          mkdir -p build/opening-frames
          profile="$(mktemp -d "$RUNNER_TEMP/closing-game-opening.XXXXXX")"
          mkdir -p "$profile/data" "$profile/config" "$profile/cache"
          install -d -m 700 "$profile/runtime"
          export XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache" XDG_RUNTIME_DIR="$profile/runtime"
          CLOSING_OPENING_CAPTURE_DIR="$PWD/build/opening-frames" LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 \
            timeout --signal=TERM 360 xvfb-run -a -s '-screen 0 1440x900x24' \
            godot --display-driver x11 --audio-driver Dummy \
              --path . --resolution 1280x800 --script tools/opening/capture_playable.gd 2>&1 | tee build/opening-frames/capture.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event.pull_request.draft }}
        with:
          name: closing-time-opening-frames
          path: |
            build/opening-frames/*.png
            build/opening-frames/capture.log
          if-no-files-found: warn
      - name: Print failed validation logs
        if: failure()
        run: |
          for f in local/validation-*.log; do echo "=== $f ==="; tail -n 80 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: local/validation-*.log
          if-no-files-found: ignore
